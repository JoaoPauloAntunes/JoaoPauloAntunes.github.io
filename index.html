    <style>
      :root {
        --ink: #0a0f0d;
        --panel: #121a17;
        --line: #1f2e28;
        --brand: #22c55e;
        --accent: #2dd4bf;
        --text: #e3ece8;
        --muted: #9aafa6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        background: radial-gradient(ellipse at top, #13241c 0%, var(--ink) 60%) fixed, var(--ink);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        padding: 56px 16px 40px;
      }
      main { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; }
      .avatar {
        width: 104px; height: 104px; border-radius: 50%; object-fit: cover;
        border: 3px solid var(--brand); box-shadow: 0 0 0 6px rgba(34, 197, 94, .12);
      }
      h1 { margin: 18px 0 4px; font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; }
      .role { margin: 0; color: var(--muted); font-size: .95rem; text-align: center; }
      .links { width: 100%; list-style: none; padding: 0; margin: 32px 0 0; display: grid; gap: 14px; }
      .link {
        display: flex; align-items: center; gap: 14px;
        padding: 14px 18px; border-radius: 16px;
        background: rgba(18, 26, 23, .85); border: 1px solid var(--line);
        color: var(--text); text-decoration: none;
        transition: transform .2s, border-color .2s, box-shadow .2s;
      }
      .link:hover, .link:focus-visible {
        transform: translateY(-2px); border-color: var(--brand);
        box-shadow: 0 10px 30px -10px rgba(34, 197, 94, .35); outline: none;
      }
      .icon {
        flex: none; width: 44px; height: 44px; border-radius: 12px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--brand), var(--accent)); color: var(--ink);
      }
      .icon svg { width: 22px; height: 22px; }
      .label { flex: 1; min-width: 0; }
      .label strong { display: block; font-size: 1rem; font-weight: 600; }
      .label span { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
      .arrow { flex: none; color: var(--muted); width: 18px; height: 18px; }
      .social { display: flex; gap: 10px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
      .social a {
        width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
        color: var(--muted); border: 1px solid var(--line); transition: color .2s, border-color .2s;
      }
      .social a:hover, .social a:focus-visible { color: var(--brand); border-color: var(--brand); outline: none; }
      .social svg { width: 20px; height: 20px; }
      footer { margin-top: 36px; color: var(--muted); font-size: .8rem; opacity: .7; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
